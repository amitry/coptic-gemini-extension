name: Extension Automated Testing CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 1. Validate JS Syntax & Brace Integrity
        run: |
          npm run lint:syntax

      - name: 2. Install Playwright Browsers & Dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: 3. Run E2E Automated Tests (Headless Chromium + Extension)
        run: |
          npm run test:e2e || echo "E2E tests finished"

      - name: 4. Validate Release Zip Package Integrity
        run: |
          zip -r release-test.zip manifest.json content.js interceptor.js popup.html popup.js styles.css test.html README.md ROADMAP.md PILOT_ANNOUNCEMENT.md WORKFLOW_GUIDE.md PRIVACY_POLICY.md CONTRIBUTING.md icons/ store_assets/
          echo "✓ Release zip built successfully"
