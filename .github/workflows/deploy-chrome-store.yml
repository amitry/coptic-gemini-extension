name: Package & Publish to Chrome Web Store

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Extension Zip Package
        run: zip -r coptic-gemini-assist.zip manifest.json content.js interceptor.js popup.html popup.js styles.css test.html README.md ROADMAP.md PILOT_ANNOUNCEMENT.md WORKFLOW_GUIDE.md PRIVACY_POLICY.md CONTRIBUTING.md ONSITE_HANDOVER_CHECKLIST.md SLACK_GITHUB_INTEGRATION.md CHROME_WEBSTORE_CI_SETUP.md package.json tests/ .github/ icons/ store_assets/ scratch/

      - name: Upload & Publish to Chrome Web Store via Direct REST API
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          echo "🔑 Requesting OAuth 2.0 Access Token from Google..."
          TOKEN_RESPONSE=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token")
          
          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('access_token', ''))")

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "❌ Failed to retrieve Access Token. Response:"
            echo "$TOKEN_RESPONSE"
            exit 1
          fi

          echo "✓ Access Token acquired. Uploading zip package to Chrome Web Store..."
          UPLOAD_RESP=$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -X PUT \
            -T coptic-gemini-assist.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID")
          
          echo "📦 Upload API Response: $UPLOAD_RESP"

          UPLOAD_STATUS=$(echo "$UPLOAD_RESP" | python3 -c "import sys, json; print(json.load(sys.stdin).get('uploadState', ''))" 2>/dev/null)
          if [ "$UPLOAD_STATUS" != "SUCCESS" ]; then
            echo "⚠️ Upload response did not return SUCCESS. (If the item has never been created manually in Chrome Dev Console first, create draft item first)."
          fi

          echo "🚀 Requesting Publish to Chrome Web Store..."
          PUBLISH_RESP=$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish")

          echo "📢 Publish API Response: $PUBLISH_RESP"

